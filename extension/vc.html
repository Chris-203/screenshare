<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Sync video chat</title>
<style>
  :root { color-scheme: dark; --line:#2a2d35; --text:#eceef2; --muted:#9095a1; --accent:#a78bfa; --ink:#140b2e; --off:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e0f12; color: var(--text); font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  #tiles { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 56px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .tile { position: relative; flex: none; width: 152px; height: 114px; border-radius: 12px; overflow: hidden; background: #17191e; border: 2px solid transparent; transition: border-color .15s; }
  .tile.talk { border-color: #34d399; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.me video { transform: scaleX(-1); }
  .tile.nocam video { visibility: hidden; }
  .av { position: absolute; inset: 0; display: none; place-items: center; }
  .tile.nocam .av { display: grid; }
  .av span { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: #2a2d35; font-size: 22px; font-weight: 600; }
  .name { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; gap: 4px; align-items: center; }
  .name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  .name i { font-style: normal; background: rgba(0,0,0,.55); padding: 2px 4px; border-radius: 6px; display: none; }
  .tile.nomic .name i { display: inline; }
  .wait { position: absolute; top: 6px; left: 6px; color: var(--muted); font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  #bar { display: flex; gap: 8px; }
  #bar button { all: unset; flex: 1; cursor: pointer; text-align: center; font-size: 16px; line-height: 1; padding: 8px 0; border-radius: 10px; background: #2a2d35; }
  #bar button.on { background: var(--accent); }
  #bar button:focus-visible { outline: 2px solid var(--accent); }
  #note { color: var(--muted); font-size: 11.5px; width: 152px; }
  #note:empty { display: none; }
  #note button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<div id="wrap">
  <div id="tiles"></div>
  <div id="note"></div>
  <div id="bar">
    <button id="cam" title="Turn camera on" aria-label="Camera" aria-pressed="false">📷</button>
    <button id="mic" title="Turn mic on" aria-label="Microphone" aria-pressed="false">🎙️</button>
  </div>
</div>
<script src="ice.js"></script>
<script src="vc.js"></script>
</body>
</html>
