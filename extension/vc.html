<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Sync video chat</title>
<style>
  :root { color-scheme: dark; --line:#2a2d35; --text:#eceef2; --muted:#9095a1; --accent:#a78bfa; --ink:#140b2e; --off:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0e0f12; color: var(--text); font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  #wrap { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
  #tiles { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 12px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  /* Tiles fill the frame's width, so dragging the box's corner (content.js) resizes them. */
  .tile { position: relative; flex: none; width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: #17191e; border: 2px solid transparent; transition: border-color .15s; }
  .tile.talk { border-color: #34d399; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.me video { transform: scaleX(-1); }
  .tile.nocam video { visibility: hidden; }
  .av { position: absolute; inset: 0; display: none; place-items: center; }
  .tile.nocam .av { display: grid; }
  .av span { width: 34%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: #2a2d35; font-size: 22px; font-weight: 600; }
  .name { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; gap: 4px; align-items: center; }
  .name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  .name i { font-style: normal; background: rgba(0,0,0,.55); padding: 2px 4px; border-radius: 6px; display: none; }
  .tile.nomic .name i { display: inline; }
  .wait { position: absolute; top: 6px; left: 6px; color: var(--muted); font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 6px; }
  /* Camera and mic float over the bottom of the tiles and only show while the pointer is over the box. */
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  body.hov:not(.bubbles) #bar, #bar:has(:focus-visible), body.hint #bar { opacity: 1; }
  #bar button { all: unset; cursor: pointer; text-align: center; font-size: 15px; line-height: 1; padding: 7px 10px; border-radius: 999px; background: rgba(0,0,0,.7); }
  #bar button.on { background: var(--accent); }
  #bar button:focus-visible { outline: 2px solid var(--accent); }
  #note { color: var(--muted); font-size: 11.5px; padding: 0 2px 34px; }
  #note:empty { display: none; }
  #note button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; }
  .rz, #ctl { display: none; }

  /* Separate bubbles: the frame covers the page, see-through, and each bubble is placed by vc.js. */
  html:has(body.bubbles), body.bubbles { background: transparent; }
  .bubbles #wrap { padding: 0; }
  .bubbles #tiles { display: block; max-height: none; overflow: visible; }
  .bubbles .tile { position: absolute; aspect-ratio: auto; border-radius: 50%; border-width: 3px; border-color: #2a2d35; cursor: grab;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); touch-action: none; user-select: none; }
  .bubbles .tile.talk { border-color: #34d399; }
  .bubbles .tile.drag { cursor: grabbing; }
  .bubbles .name { left: 0; right: 0; bottom: 9%; justify-content: center; }
  .bubbles .wait { left: 50%; top: 14%; transform: translateX(-50%); }
  /* The resize handle sits on the bubble's edge, at the lower right. */
  .bubbles .rz { display: block; position: absolute; right: calc(14.6% - 4px); bottom: calc(14.6% - 4px); width: 18px; height: 18px; border-radius: 50%;
    cursor: nwse-resize; opacity: 0; transition: opacity .2s; background: #eceef2; box-shadow: 0 0 0 3px rgba(0,0,0,.45); }
  .bubbles .tile.hov .rz, .bubbles .tile.drag .rz { opacity: 1; }
  /* Your buttons, as one small pill under your own bubble (placed by vc.js), shown while you point at it. */
  #tools { display: none; }
  .bubbles #tools { display: flex; align-items: center; gap: 4px; position: absolute; padding: 4px; border-radius: 999px; background: rgba(14,15,18,.92);
    border: 1px solid var(--line); opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
  body.mehov #tools, #tools:has(:focus-visible), body.bubbles.hint #tools { opacity: 1; pointer-events: auto; }
  .bubbles #tools #bar { position: static; transform: none; opacity: 1; gap: 4px; }
  .bubbles #tools #ctl { display: flex; gap: 2px; padding-left: 4px; border-left: 1px solid var(--line); }
  .bubbles #tools button { padding: 6px 8px; }
  #ctl button { all: unset; cursor: pointer; min-width: 22px; height: 26px; border-radius: 999px; text-align: center; font-size: 14px; font-weight: 600; line-height: 26px; color: var(--text); }
  #ctl button:hover { background: #2a2d35; }
  #ctl button:focus-visible { outline: 2px solid var(--accent); }
  .bubbles #note { position: absolute; max-width: 220px; padding: 6px 8px; border-radius: 8px; background: rgba(14,15,18,.92); color: var(--text); }
</style>
</head>
<body>
<div id="wrap">
  <div id="tiles"></div>
  <div id="note"></div>
  <div id="tools"></div>
  <div id="ctl"><button id="bmin" title="Hide videos (you stay in the call)" aria-label="Hide videos">–</button><button id="blay" title="Put everyone in one box" aria-label="One box">⧉</button><button id="bx" title="Leave video chat" aria-label="Leave video chat">×</button></div>
  <div id="bar">
    <button id="cam" title="Turn camera on" aria-label="Camera" aria-pressed="false">📷</button>
    <button id="mic" title="Turn mic on" aria-label="Microphone" aria-pressed="false">🎙️</button>
  </div>
</div>
<script src="ice.js"></script>
<script src="vc.js"></script>
</body>
</html>
