<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Watch Sync: camera and mic</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f12; color: #eceef2; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #9095a1; margin: 0 0 16px; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px; padding: 10px 18px; background: #a78bfa; color: #140b2e; }
</style>
</head>
<body>
<main>
  <h1>Camera and mic for video chat</h1>
  <p id="msg">Chrome will ask once. Say Allow, then go back to your show.</p>
  <button id="go">Allow camera and mic</button>
</main>
<script src="allow.js"></script>
</body>
</html>
